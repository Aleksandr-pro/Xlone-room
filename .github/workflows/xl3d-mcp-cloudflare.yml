name: Build & Deploy XL3D MCP (Cloudflare Worker)

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'apps/xl3d-mcp/**'
      - 'apps/xl3d/src/core/**'
      - 'apps/xl3d/src/engine/**'
      - '.github/workflows/xl3d-mcp-cloudflare.yml'
  workflow_dispatch:

jobs:
  build-and-deploy-mcp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install, Typecheck, Test & Build xl3d-mcp
        run: |
          npm ci
          npm --workspace=apps/xl3d-mcp run typecheck
          npm --workspace=apps/xl3d-mcp test
          npm --workspace=apps/xl3d-mcp run build
          npx --workspace=apps/xl3d-mcp wrangler deploy --dry-run --outdir /tmp/xl3d-mcp-dry

      - name: Deploy to Cloudflare Workers (Free Tier)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/xl3d-mcp
          command: deploy

      - name: Cloudflare Secrets Notice
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' || secrets.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "Cloudflare secrets (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID) are not configured yet."
          echo "Worker bundle verified via wrangler --dry-run. Add secrets in GitHub Settings -> Secrets -> Actions to enable auto-deploy."
