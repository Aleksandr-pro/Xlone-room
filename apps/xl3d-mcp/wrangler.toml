name = "xl3d-mcp"
main = "src/worker.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Set GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, AUTH_SECRET, or MCP_TOKEN
# in Cloudflare Dashboard (Variables & Secrets) or `wrangler secret put`.

[[durable_objects.bindings]]
name = "ROOM_HUB"
class_name = "RoomHub"

[[durable_objects.bindings]]
name = "ACCOUNT_HUB"
class_name = "AccountHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomHub"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AccountHub"]
